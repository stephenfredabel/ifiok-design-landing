<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ifiok preview viewer</title>
<style>
  /* Frame page: shows a view inside an iframe at a fixed width so the page's own media queries respond. */
  :root { --bg: #e2e8f0; --frame: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1220; --frame: #0b1220; } }
  :root[data-theme="dark"] { --bg: #0b1220; --frame: #0b1220; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { overflow: hidden; }
  #pv-stage { margin: 12px auto 0; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); border-radius: 10px; overflow: hidden; background: var(--frame); }
  #pv-frame { display: block; border: 0; transform-origin: 0 0; background: var(--frame); }
</style>
</head>
<body data-pv="viewer">
<noscript><p style="font:16px system-ui;padding:24px">The viewer needs JavaScript. You can still open <a href="home.html">home.html</a>, <a href="cart.html">cart.html</a> and <a href="admin-carts.html">admin-carts.html</a> directly.</p></noscript>
<script src="preview.js"></script>
</body>
</html>
